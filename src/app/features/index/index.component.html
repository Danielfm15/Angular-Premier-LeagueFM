<app-premier-header></app-premier-header>

<nav class="main-nav" role="navigation">
  <div class="main-nav-links">
    <img
      class="premier-logo fade-in"
      src="/assets/images/logoTFG.png"
      alt="Premier League Master"
    />

    <div class="dropdown" tabindex="0">
      <span>Premier League <i class="fas fa-chevron-down"></i></span>
      <div class="submenu">
        <a routerLink="/calendario">Calendario</a>
        <a routerLink="/clasificacion">Clasificación</a>
      </div>
    </div>

    <div class="dropdown" tabindex="0">
      <span>Acerca de <i class="fas fa-chevron-down"></i></span>
      <div class="submenu">
        <a routerLink="/politicas">Política</a>
        <a routerLink="/normas">Normas</a>
        <a routerLink="/avisolegal">Aviso Legal</a>
        <a routerLink="/contacto">Contacto</a>
      </div>
    </div>

    <div class="dropdown" tabindex="0">
      <span>Premier League Master <i class="fas fa-chevron-down"></i></span>
      <div class="submenu">
        <a routerLink="/index" aria-current="page">Inicio</a>

        <!-- 🔒 RUTAS PRIVADAS (guard se encarga) -->
        <a routerLink="/ligas">Ligas</a>
        <a routerLink="/mercado">Mercado</a>
      </div>
    </div>
  </div>

  <div class="more-than-game">Más que un juego</div>
</nav>

<main class="main-content">
  <section class="hero-section">
    <div class="hero-content slide-in-left">
      <div class="fantasy-logo">
        <img src="/assets/images/logoTFG.png" />
        <h1>Premier League Master</h1>
      </div>

      <nav class="hero-nav">
        <a routerLink="/index" class="active">Inicio</a>

        <!-- Login / Logout dinámico -->
        <a *ngIf="!isLoggedIn()" routerLink="/login">Login</a>
        <a *ngIf="isLoggedIn()" (click)="logout()" href="#">Cerrar sesión</a>

        <!-- Privadas -->
        <a routerLink="/ligas">Ligas</a>
        <a routerLink="/mercado">Mercado</a>

        <!-- Públicas -->
        <a routerLink="/clasificacion">Clasificación</a>
      </nav>
    </div>

    <img
      class="hero-image slide-in-right"
      src="/assets/images/media/hero-image.png"
      alt="Jugadores Premier League"
    />
  </section>
</main>

<footer class="site-footer fade-in">
  <p>© 2025 Premier League Master</p>
  <nav class="footer-links">
    <a routerLink="/politicas">Privacidad</a>
    <a routerLink="/normas">Normas</a>
    <a routerLink="/avisolegal">Aviso Legal</a>
    <a routerLink="/contacto">Contacto</a>
  </nav>
</footer>

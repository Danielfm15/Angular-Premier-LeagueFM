<app-premier-header></app-premier-header>
<app-main-nav></app-main-nav>

<main class="main-content">
  <section class="hero-section">
    <div class="hero-content slide-in-left">
      <div class="fantasy-logo">
        <img src="/assets/images/logoTFG.png" />
        <h1>Premier League Master</h1>
      </div>

      <nav class="hero-nav">
        <a routerLink="/index" class="active">Inicio</a>

        <!-- Login / Logout dinámico -->
        <a *ngIf="!isLoggedIn()" routerLink="/login">Login</a>
        <a *ngIf="isLoggedIn()" (click)="logout()" class="logout-link">Cerrar sesión</a>

        <!-- Privadas -->
        <a routerLink="/ligas">Ligas</a>
        <a routerLink="/mercado">Mercado</a>

        <!-- Públicas -->
        <a routerLink="/clasificacion">Clasificación</a>
      </nav>
    </div>

    <img
      class="hero-image slide-in-right"
      src="/assets/images/media/hero-image.png"
      alt="Jugadores Premier League"
    />
  </section>
</main>

<app-footer></app-footer>

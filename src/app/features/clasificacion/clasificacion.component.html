<app-premier-header></app-premier-header>
<app-main-nav></app-main-nav>

<main class="table-container">
  <table aria-label="Tabla de clasificación de la liga">
    <!-- ✅ CABECERA ÚNICA Y FIJA -->
    <thead>
      <tr>
        <th>#</th>
        <th>Club</th>
        <th>PJ</th>
        <th>V</th>
        <th>E</th>
        <th>D</th>
        <th>GF</th>
        <th>GC</th>
        <th>DG</th>
        <th>Pts</th>
      </tr>
    </thead>

    <!-- ✅ SOLO CAMBIA EL TBODY -->
    <tbody *ngIf="!loading; else loadingTpl">
      <tr
        *ngFor="let equipo of clasificacion; let i = index"
        [ngClass]="filaClase(i)"
        class="row-animate"
        [style.animationDelay.ms]="i * 40"
      >
        <td class="position">
  {{ i + 1 }}
  <span
    *ngIf="i <= 5 || i >= clasificacion.length - 3"
    class="pos-indicator"
    [attr.data-type]="filaClase(i)"
  ></span>
</td>


        <td class="team-cell">
          <img
            *ngIf="getEscudo(equipo.nombre) as escudo"
            [src]="escudo"
            [alt]="equipo.nombre"
            class="team-logo"
          />
          {{ equipo.nombre }}
        </td>

        <td>{{ equipo.partidos_jugados }}</td>
        <td>{{ equipo.partidos_ganados }}</td>
        <td>{{ equipo.partidos_empatados }}</td>
        <td>{{ equipo.partidos_perdidos }}</td>
        <td>{{ equipo.goles_a_favor }}</td>
        <td>{{ equipo.goles_en_contra }}</td>
        <td>{{ equipo.diferencia_goles }}</td>
        <td class="pts">{{ equipo.puntos }}</td>
      </tr>
    </tbody>
  </table>

  <!-- ✅ SKELETON LOADING -->
  <ng-template #loadingTpl>
    <tbody>
      <tr *ngFor="let _ of [].constructor(10)">
        <td colspan="10" class="skeleton-row"></td>
      </tr>
    </tbody>
  </ng-template>
</main>

<app-footer></app-footer>

<app-premier-header></app-premier-header>
<app-main-nav></app-main-nav>

<main class="alineacion-page">
  <!-- CONTENIDO PRINCIPAL -->
  <div class="alineacion-layout">
    <!-- CAMPO + ALINEACIÓN -->
    <div class="lineup-container">
      <div class="lineup-header">
        <h2>
          <span class="number">11</span>
          INICIAL
        </h2>

        <select class="formation-dropdown">
          <option value="4-2-1-3">4-2-1-3</option>
          <option value="4-3-3">4-3-3</option>
          <option value="4-4-2">4-4-2</option>
          <option value="3-5-2">3-5-2</option>
          <option value="5-3-2">5-3-2</option>
        </select>
      </div>

      <div class="field-container" id="campo">
        <div class="field-lines">
          <div class="center-circle"></div>
          <div class="center-dot"></div>
          <div class="penalty-box-top"></div>
          <div class="penalty-box-bottom"></div>
          <div class="goal-box-top"></div>
          <div class="goal-box-bottom"></div>
        </div>

        <!-- POSICIONES -->
        <div class="player gk"></div>
        <div class="player lb"></div>
        <div class="player lcb"></div>
        <div class="player rcb"></div>
        <div class="player rb"></div>
        <div class="player ldm"></div>
        <div class="player rdm"></div>
        <div class="player cam"></div>
        <div class="player lw"></div>
        <div class="player st"></div>
        <div class="player rw"></div>
      </div>
    </div>

    <!-- PANEL LATERAL -->
    <aside class="filters-section">
  <h2 class="filters-title">Filtros de jugadores</h2>

  <!-- BUSCADOR -->
  <div class="filter-group">
    <label>Buscar jugador</label>
    <input type="text" placeholder="Nombre del jugador" />
  </div>

  <!-- PRESUPUESTO -->
  <div class="filter-group presupuesto">
    <span class="label">Presupuesto restante</span>
    <span id="presupuesto-restante" class="valor">300 M</span>
  </div>

  <!-- POSICIÓN -->
  <div class="filter-group">
    <label>Posición</label>
    <select>
      <option value="">Todas</option>
      <option value="Portero">Portero</option>
      <option value="Defensa">Defensa</option>
      <option value="Centrocampista">Centrocampista</option>
      <option value="Delantero">Delantero</option>
    </select>
  </div>

  <!-- LISTA DE JUGADORES -->
  <div class="player-list">
    <!-- CARD DE JUGADOR (ejemplo visual) -->
    <div class="player-card">
      <img src="/assets/images/jugadores/empty.png" alt="Jugador" />
      <div class="info">
        <span class="name">Jugador Ejemplo</span>
        <span class="meta">Delantero · 12 pts</span>
      </div>
    </div>

    <div class="player-card">
      <img src="/assets/images/jugadores/empty.png" alt="Jugador" />
      <div class="info">
        <span class="name">Otro Jugador</span>
        <span class="meta">Defensa · 8 pts</span>
      </div>
    </div>
  </div>

  <!-- ACCIONES -->
  <div class="acciones">
    <button class="guardar-btn primary">💾 Guardar alineación</button>
    <button class="guardar-btn danger">🗑️ Eliminar alineación</button>
  </div>
</aside>
  </div>
</main>

<app-footer></app-footer>
